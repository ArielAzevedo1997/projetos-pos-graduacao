name: Materialize Case OpenAI artifacts

on:
  push:
    branches: [main]
    paths:
      - 'Case OpenAI/.artifact_payload.json'
      - '.github/workflows/materialize-case-openai.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas openpyxl pyarrow

      - name: Materialize final artifacts
        run: |
          python - <<'PY'
          import base64
          import gzip
          import io
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('Case OpenAI')
          payload = json.loads((root / '.artifact_payload.json').read_text(encoding='utf-8'))

          csv_bytes = gzip.decompress(base64.b64decode(payload['curated_csv_gz_b64']))
          df = pd.read_csv(io.BytesIO(csv_bytes))

          # Preserve the final 200-ticket curated dataset in both requested formats.
          df.to_excel(root / 'tickets_curated.xlsx', index=False)
          df.to_parquet(root / 'tickets_curated.parquet', index=False)

          resultado = gzip.decompress(base64.b64decode(payload['resultado_json_gz_b64']))
          (root / 'resultado.json').write_bytes(resultado)
          PY

      - name: Commit generated files and cleanup
        run: |
          rm 'Case OpenAI/.artifact_payload.json'
          rm '.github/workflows/materialize-case-openai.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Adiciona artefatos finais do Case OpenAI'
          git push
